name: CI

env:
  AHEART_EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - 'codex/**'
  pull_request:
    branches:
      - master

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.17.0
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Unit and script tests
        run: pnpm test

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.17.0
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck

  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.17.0
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: R1 branch coverage
        run: pnpm test:coverage:r1
      - name: Upload coverage evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: d9-r1-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            packages/components/coverage/
            packages/dnd/coverage/
            packages/ai/coverage/
          if-no-files-found: error

  build-generated:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.17.0
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Check Build Determinism and Generated Output
        id: build_generated
        run: pnpm check:build-determinism
      - name: Capture Build Diagnostics
        if: ${{ failure() && steps.build_generated.outcome == 'failure' }}
        run: |
          mkdir -p test-results/build-generated-diagnostics
          git diff --cached HEAD -- packages/components/es packages/components/lib packages/dnd/es packages/dnd/lib packages/ai/es packages/ai/lib > test-results/build-generated-diagnostics/generated-cached.diff
          git diff -- packages/components/es packages/components/lib packages/dnd/es packages/dnd/lib packages/ai/es packages/ai/lib > test-results/build-generated-diagnostics/generated-worktree.diff
          git ls-files --others -- packages/components/es packages/components/lib packages/dnd/es packages/dnd/lib packages/ai/es packages/ai/lib > test-results/build-generated-diagnostics/generated-untracked.txt
      - name: Upload Build Diagnostics
        if: ${{ failure() && steps.build_generated.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: build-generated-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/build-generated-diagnostics/
          if-no-files-found: error
      - name: Check Whitespace
        run: git diff --check

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.17.0
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build Docs
        run: pnpm docs:build

  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.17.0
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Verify Release Tarballs
        run: pnpm release:pack --pack-destination test-results/release-tarballs
      - name: Strict packed consumer types (workspace Vue and Vue 3.5.44)
        run: pnpm check:consumer-types
      - name: Pack and run isolated consumers
        run: |
          pack_dir=$(mktemp -d)
          root_out=$(mktemp -d)
          form_out=$(mktemp -d)
          d8_out=$(mktemp -d)
          pnpm --dir packages/components pack --json --pack-destination "$pack_dir" > "$pack_dir/pack.json"
          pnpm --dir packages/dnd pack --json --pack-destination "$pack_dir" > "$pack_dir/dnd-pack.json"
          pnpm --dir packages/ai pack --json --pack-destination "$pack_dir" > "$pack_dir/ai-pack.json"
          components_tarball="$(node -p 'require(process.argv[1]).filename' "$pack_dir/pack.json")"
          dnd_tarball="$(node -p 'require(process.argv[1]).filename' "$pack_dir/dnd-pack.json")"
          ai_tarball="$(node -p 'require(process.argv[1]).filename' "$pack_dir/ai-pack.json")"
          node scripts/root-entry-consumer.mjs --tarball "$components_tarball" --out "$root_out"
          node scripts/form-list-consumer.mjs --tarball "$components_tarball" --out "$form_out"
          node docs/superpowers/experiments/d8-consumer/run.mjs --out "$d8_out" --components-tarball "$components_tarball" --dnd-tarball "$dnd_tarball" --ai-tarball "$ai_tarball"
          mkdir -p test-results/d9-consumers
          cp "$root_out/results.json" test-results/d9-consumers/root-results.json
          cp "$form_out/results.json" test-results/d9-consumers/form-results.json
          cp "$d8_out/results.json" test-results/d9-consumers/d8-results.json
      - name: M3 scoped entries, CSS and resolver
        run: pnpm check:m3-consumer
      - name: M3 packed consumer and Workbench pilot
        run: |
          core_version=$(node -p 'require("./packages/components/package.json").version')
          ai_version=$(node -p 'require("./packages/ai/package.json").version')
          dnd_version=$(node -p 'require("./packages/dnd/package.json").version')
          node pilots/run-baselines.mjs --entry-mode subpath --only clean-consumer,ai-review-gate \
            --core-tarball "test-results/release-tarballs/aheart-ui-$core_version.tgz" \
            --ai-tarball "test-results/release-tarballs/aheart-ui-ai-$ai_version.tgz" \
            --dnd-tarball "test-results/release-tarballs/aheart-ui-dnd-$dnd_version.tgz" \
            --out test-results/m3-pilots
          node pilots/run-baselines.mjs --entry-mode legacy --only ai-review-gate \
            --core-tarball "test-results/release-tarballs/aheart-ui-$core_version.tgz" \
            --ai-tarball "test-results/release-tarballs/aheart-ui-ai-$ai_version.tgz" \
            --dnd-tarball "test-results/release-tarballs/aheart-ui-dnd-$dnd_version.tgz" \
            --out test-results/m3-legacy-pilot
      - name: M1 public entries, CSS and module graph
        run: pnpm check:m1-consumer
      - name: M1 split and compatibility pilot paths
        run: |
          mkdir -p test-results/m1-pilots
          core_version=$(node -p 'require("./packages/components/package.json").version')
          node pilots/run-baselines.mjs --core-tarball "test-results/release-tarballs/aheart-ui-$core_version.tgz" --entry-mode subpath --only clean-consumer,muxu-todo --out test-results/m1-pilots/chromium
          node pilots/run-baselines.mjs --core-tarball "test-results/release-tarballs/aheart-ui-$core_version.tgz" --entry-mode subpath --only clean-consumer --browser firefox --out test-results/m1-pilots/firefox
          node pilots/run-baselines.mjs --core-tarball "test-results/release-tarballs/aheart-ui-$core_version.tgz" --entry-mode subpath --only clean-consumer --browser webkit --out test-results/m1-pilots/webkit
      - name: Upload Consumer Evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: consumer-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/release-tarballs/*.tgz
            test-results/m1-consumer/
            test-results/m3-consumer/*.log
            test-results/m3-consumer/results.json
            test-results/m3-pilots/results.json
            test-results/m3-pilots/*/results.json
            test-results/m3-pilots/*/module-graph.json
            test-results/m3-legacy-pilot/results.json
            test-results/m3-legacy-pilot/*/results.json
            test-results/m1-pilots/
            test-results/d9-consumers/*-results.json
            test-results/d9-consumers/strict/results.json
            test-results/d9-consumers/strict/vue-*/*.log
          if-no-files-found: error

  browser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.17.0
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: End-to-End Tests
        id: e2e
        run: pnpm test:e2e:non-qg5
      - name: Upload End-to-End Evidence
        if: ${{ always() && steps.e2e.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn

  qg5-cross-browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - desktop
          - mobile
          - desktop-firefox
          - desktop-webkit
          - mobile-webkit
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.17.0
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: QG5 E2E
        run: pnpm exec playwright test e2e/cross-browser-production.spec.ts e2e/cross-browser-r1.spec.ts --project "${{ matrix.project }}"
      - name: Upload QG5 Playwright Evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: qg5-${{ matrix.project }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
