name: CI

env:
  AHEART_EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - 'codex/**'
  pull_request:
    branches:
      - master

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.17.0
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Unit and script tests
        run: pnpm test

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.17.0
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck

  build-generated:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.17.0
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Check Build Determinism and Generated Output
        id: build_generated
        run: pnpm check:build-determinism
      - name: Capture Build Diagnostics
        if: ${{ failure() && steps.build_generated.outcome == 'failure' }}
        run: |
          mkdir -p test-results/build-generated-diagnostics
          git diff --cached HEAD -- packages/components/es packages/components/lib packages/dnd/es packages/dnd/lib packages/ai/es packages/ai/lib > test-results/build-generated-diagnostics/generated-cached.diff
          git diff -- packages/components/es packages/components/lib packages/dnd/es packages/dnd/lib packages/ai/es packages/ai/lib > test-results/build-generated-diagnostics/generated-worktree.diff
          git ls-files --others -- packages/components/es packages/components/lib packages/dnd/es packages/dnd/lib packages/ai/es packages/ai/lib > test-results/build-generated-diagnostics/generated-untracked.txt
      - name: Upload Build Diagnostics
        if: ${{ failure() && steps.build_generated.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: build-generated-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/build-generated-diagnostics/
          if-no-files-found: error
      - name: Check Whitespace
        run: git diff --check

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.17.0
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build Docs
        run: pnpm docs:build

  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.17.0
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify Release Tarballs
        run: pnpm release:pack
      - name: Pack and run isolated consumers
        run: |
          pack_dir=$(mktemp -d)
          root_out=$(mktemp -d)
          form_out=$(mktemp -d)
          d8_out=$(mktemp -d)
          pnpm --dir packages/components pack --json --pack-destination "$pack_dir" > "$pack_dir/pack.json"
          pnpm --dir packages/dnd pack --json --pack-destination "$pack_dir" > "$pack_dir/dnd-pack.json"
          pnpm --dir packages/ai pack --json --pack-destination "$pack_dir" > "$pack_dir/ai-pack.json"
          components_tarball="$pack_dir/aheart-ui-1.0.0.tgz"
          dnd_tarball="$pack_dir/aheart-ui-dnd-1.0.0.tgz"
          ai_tarball="$pack_dir/aheart-ui-ai-1.0.0.tgz"
          node scripts/root-entry-consumer.mjs --tarball "$components_tarball" --out "$root_out"
          node scripts/form-list-consumer.mjs --tarball "$components_tarball" --out "$form_out"
          node docs/superpowers/experiments/d8-consumer/run.mjs --out "$d8_out" --components-tarball "$components_tarball" --dnd-tarball "$dnd_tarball" --ai-tarball "$ai_tarball"
          mkdir -p test-results/d9-consumers
          cp "$root_out/results.json" test-results/d9-consumers/root-results.json
          cp "$form_out/results.json" test-results/d9-consumers/form-results.json
          cp "$d8_out/results.json" test-results/d9-consumers/d8-results.json
      - name: Upload Consumer Evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: consumer-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/d9-consumers/
          if-no-files-found: error

  browser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.17.0
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: End-to-End Tests
        id: e2e
        run: pnpm test:e2e:non-qg5
      - name: Upload End-to-End Evidence
        if: ${{ always() && steps.e2e.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn

  qg5-cross-browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - desktop
          - mobile
          - desktop-firefox
          - desktop-webkit
          - mobile-webkit
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.17.0
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: QG5 E2E
        run: pnpm exec playwright test e2e/cross-browser-production.spec.ts e2e/cross-browser-r1.spec.ts --project "${{ matrix.project }}"
      - name: Upload QG5 Playwright Evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: qg5-${{ matrix.project }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
